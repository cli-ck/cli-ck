name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.3.0-beta"
        required: true
        type: string

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - id: release
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha-[1-9][0-9]*$ ]]; then
            CHANNEL=alpha
            PRERELEASE=true
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            CHANNEL=beta
            PRERELEASE=true
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
            PRERELEASE=false
          else
            echo "Invalid release tag: $TAG" >&2
            echo "Use vX.Y.Z-alpha-N, vX.Y.Z-beta, or vX.Y.Z." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify application version matches release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)

          test "$PACKAGE_VERSION" = "$VERSION"
          test "$TAURI_VERSION" = "$VERSION"
          test "$CARGO_VERSION" = "$VERSION"

  publish-tauri:
    needs: release-metadata
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            sidecar-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            sidecar-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
            sidecar-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust-target: ""
            sidecar-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified Code Intel sidecar
        env:
          CODE_INTEL_RELEASE_TOKEN: ${{ secrets.CODE_INTEL_RELEASE_TOKEN }}
          CODE_INTEL_TARGET: ${{ matrix.sidecar-target }}
        run: node scripts/fetch-code-intel-sidecar.mjs

      - name: Configure Tauri updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        if: env.KEY != ''
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=${{ env.KEY }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ env.PASS }}" >> "$GITHUB_ENV"

      - name: Configure Apple signing certificate
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY: ${{ secrets.APPLE_API_KEY }}
        if: env.CERT != ''
        shell: bash
        run: |
          echo "APPLE_CERTIFICATE=${{ env.CERT }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ env.PASS }}" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=${{ env.IDENTITY }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ env.TEAM }}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${{ env.ISSUER }}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=${{ env.KEY }}" >> "$GITHUB_ENV"

      - name: Write Apple API key to disk
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        if: startsWith(matrix.platform, 'macos') && env.KEY_CONTENT != ''
        shell: bash
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Disable updater signing if keys are missing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        shell: bash
        run: |
          echo "No tauri signing key found, disabling updater artifacts creation"
          jq '.bundle.createUpdaterArtifacts = false' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.release-metadata.outputs.tag }}
          releaseName: "cli-ck ${{ needs.release-metadata.outputs.tag }}"
          releaseBody: "See the assets to download and install. Stable releases include auto-updates."
          releaseDraft: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Zip release binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/cli-ck.exe -DestinationPath src-tauri/target/release/cli-ck_windows_x64.zip
          gh release upload ${{ needs.release-metadata.outputs.tag }} src-tauri/target/release/cli-ck_windows_x64.zip --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip release binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          zip -j src-tauri/target/release/cli-ck_linux_x64.zip src-tauri/target/release/cli-ck
          gh release upload ${{ needs.release-metadata.outputs.tag }} src-tauri/target/release/cli-ck_linux_x64.zip --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          # Fail loud if Tauri/linuxdeploy stops bundling these, so a future
          # layout change cannot silently ship an unfixed AppImage.
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test -e "squashfs-root/usr/lib/$lib" \
              || { echo "expected bundled lib missing: $lib (layout changed?)"; exit 1; }
          done

          rm -f squashfs-root/usr/lib/libwayland-client.so.0 \
                squashfs-root/usr/lib/libwayland-egl.so.1 \
                squashfs-root/usr/lib/libwayland-cursor.so.0 \
                squashfs-root/usr/lib/libwayland-server.so.0

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          for lib in libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0; do
            test ! -e "squashfs-root/usr/lib/$lib" \
              || { echo "lib still present after repack: $lib"; exit 1; }
          done
          test -x squashfs-root/usr/bin/cli-ck \
            || { echo "cli-ck binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          TAG="${{ needs.release-metadata.outputs.tag }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            rm -f "$APPIMAGE.sig"
            pnpm tauri signer sign "$APPIMAGE"
            gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Skipping AppImage signing as private key is missing"
            gh release upload "$TAG" "$APPIMAGE" \
              --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # Patch the AppImage signature into the combined updater manifest. Runs once,
  # after every matrix leg has finished merging its platform into latest.json,
  # so it operates on the full manifest and cannot be clobbered by a parallel
  # macOS/Windows upload. Both linux keys point at the AppImage and both carry
  # a signature, so both are patched.
  patch-appimage-updater:
    needs: [release-metadata, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with re-signed AppImage signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          TAG="${{ needs.release-metadata.outputs.tag }}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" --pattern "*_amd64.AppImage.sig" --clobber

          SIG_FILE=$(ls ./*_amd64.AppImage.sig | head -n1)
          NEW_SIG=$(cat "$SIG_FILE")

          jq -e 'has("platforms") and (.platforms | has("linux-x86_64"))' latest.json >/dev/null \
            || { echo "latest.json missing platforms.linux-x86_64"; exit 1; }

          jq --arg sig "$NEW_SIG" '
            .platforms["linux-x86_64"].signature = $sig
            | if .platforms["linux-x86_64-appimage"]
              then .platforms["linux-x86_64-appimage"].signature = $sig else . end
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  publish-npm:
    needs: [release-metadata, publish-tauri]
    if: needs.release-metadata.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set dynamic version in wrapper package.json
        run: |
          TAG="${{ needs.release-metadata.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "Setting version to $VERSION"
          jq --arg version "$VERSION" '.version = $version' npm-wrapper/package.json > npm-wrapper/package.json.tmp
          mv npm-wrapper/package.json.tmp npm-wrapper/package.json

      - name: Publish to npm
        run: |
          cd npm-wrapper
          PKG_NAME=$(jq -r '.name' package.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          echo "Checking if $PKG_NAME@$PKG_VERSION is already published..."
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION of $PKG_NAME is already published. Skipping publish."
          else
            echo "Publishing $PKG_NAME@$PKG_VERSION to NPM..."
            npm publish --access public --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release:
    needs: [release-metadata, patch-appimage-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
